# Ephemeral PostgreSQL for the CareShield Max buy journey.
# `docker compose up -d` is all that is needed; data lives in an anonymous
# volume so `docker compose down -v` gives you a clean slate every time.
services:
  postgres:
    image: postgres:16-alpine
    container_name: careshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careshield
      POSTGRES_PASSWORD: careshield
      POSTGRES_DB: careshield
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careshield -d careshield']
      interval: 3s
      timeout: 3s
      retries: 20
